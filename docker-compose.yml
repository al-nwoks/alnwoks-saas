version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alnwoks-frontend
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.frontend.rule=Host(`www.alnwoks.com`)" # Replace with your subdomain
    #   - "traefik.http.routers.frontend.entrypoints=websecure"
    #   - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
    #   - "traefik.http.routers.frontend.service=frontend"
    #   - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://alnwoks-frontend:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alnwoks-network

networks:
  alnwoks-network:
    driver: bridge
