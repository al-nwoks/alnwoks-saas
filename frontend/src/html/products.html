<!-- Products Section -->
<section id="products" class="py-20 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-16">
            <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-6" data-aos="fade-up">Innovative Product
                Portfolio</h2>
            <p class="text-xl text-gray-600 max-w-3xl mx-auto" data-aos="fade-up" data-aos-delay="200">
                Cutting-edge products that solve real business challenges across industries with measurable results
                and seamless integration.
            </p>
        </div>

        <!-- Product Navigation -->
        <div class="flex flex-wrap justify-center gap-4 mb-12" data-aos="fade-up" data-aos-delay="400">
            <button @click="setActiveProduct('eazybdc')"
                :class="activeProduct === 'eazybdc' ? 'bg-primary-600 text-white' : 'border-2 border-primary-600 text-primary-600 hover:bg-primary-600 hover:text-white'"
                class="px-6 py-3 rounded-lg font-medium transition-colors duration-200">eazyBDC</button>
            <button @click="setActiveProduct('flowai')"
                :class="activeProduct === 'flowai' ? 'bg-primary-600 text-white' : 'border-2 border-primary-600 text-primary-600 hover:bg-primary-600 hover:text-white'"
                class="px-6 py-3 rounded-lg font-medium transition-colors duration-200">Flow AI</button>
            <button @click="setActiveProduct('ottomate')"
                :class="activeProduct === 'ottomate' ? 'bg-primary-600 text-white' : 'border-2 border-primary-600 text-primary-600 hover:bg-primary-600 hover:text-white'"
                class="px-6 py-3 rounded-lg font-medium transition-colors duration-200">Ottomate</button>
            <button @click="setActiveProduct('datatloop')"
                :class="activeProduct === 'datatloop' ? 'bg-primary-600 text-white' : 'border-2 border-primary-600 text-primary-600 hover:bg-primary-600 hover:text-white'"
                class="px-6 py-3 rounded-lg font-medium transition-colors duration-200">Datatloop</button>
        </div>

        <!-- Product Showcase -->
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden" data-aos="fade-up">
                <div class="p-8">
                    <div class="grid lg:grid-cols-2 gap-8 items-center">
                        <div>
                            <div class="flex items-center mb-4">
                                <h3 x-text="getActiveProduct().name" class="text-3xl font-bold text-gray-900 mr-4">
                                </h3>
                                <span x-text="getActiveProduct().tagline" class="text-gray-600"></span>
                            </div>
                            <p x-text="getActiveProduct().description" class="text-gray-600 mb-6" data-aos="fade-up"
                                data-aos-delay="100"></p>

                            <div class="mb-6">
                                <h4 class="font-semibold text-gray-900 mb-3" data-aos="fade-up" data-aos-delay="200">Key
                                    Features:</h4>
                                <ul class="space-y-2">
                                    <template x-for="(feature, index) in getActiveProduct().features" :key="feature">
                                        <li class="flex items-center text-gray-600" data-aos="fade-up"
                                            :data-aos-delay="300 + (index * 100)">
                                            <svg class="w-5 h-5 text-primary-600 mr-3" fill="none" stroke="currentColor"
                                                viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M5 13l4 4L19 7"></path>
                                            </svg>
                                            <span x-text="feature"></span>
                                        </li>
                                    </template>
                                </ul>
                            </div>

                            <div class="flex gap-4">
                                <a :href="getActiveProduct().link" target="_blank"
                                    class="bg-primary-600 text-white px-6 py-3 rounded-lg hover:bg-primary-700 transition-colors duration-200"
                                    data-aos="fade-up" data-aos-delay="700">Visit
                                    Product Site</a>
                                <a href="#contact"
                                    class="border-2 border-primary-600 text-primary-600 px-6 py-3 rounded-lg hover:bg-primary-600 hover:text-white transition-colors duration-200"
                                    data-aos="fade-up" data-aos-delay="800">Request
                                    Demo</a>
                            </div>
                        </div>

                        <div class="relative">
                            <div :class="'bg-gradient-to-br ' + getActiveProduct().color"
                                class="rounded-xl p-8 text-white">
                                <div class="text-center">
                                    <div
                                        class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <span x-text="getActiveProduct().name.charAt(0)"
                                            class="text-3xl font-bold"></span>
                                    </div>
                                    <h4 x-text="getActiveProduct().name" class="text-2xl font-bold mb-2"></h4>
                                    <p x-text="getActiveProduct().tagline" class="opacity-90"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
