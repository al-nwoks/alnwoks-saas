<!-- Contact Section -->
<section id="contact" class="py-20 bg-gray-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-16">
            <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-6" data-aos="fade-up">Get In Touch</h2>
            <p class="text-xl text-gray-600 max-w-3xl mx-auto" data-aos="fade-up" data-aos-delay="200">
                Ready to transform your business with our technology solutions? Contact us today to start the
                conversation.
            </p>
        </div>

        <div class="grid lg:grid-cols-2 gap-12">
            <div data-aos="fade-right">
                <h3 class="text-2xl font-bold text-gray-900 mb-6">Contact Information</h3>
                <div class="space-y-6">
                    <div class="flex items-start space-x-4">
                        <div
                            class="w-12 h-12 bg-primary-100 text-primary-600 rounded-lg flex items-center justify-center flex-shrink-0">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z">
                                </path>
                            </svg>
                        </div>
                        <div>
                            <h4 class="font-semibold text-gray-900 mb-1">Phone</h4>
                            <p class="text-gray-600">+1 (555) 123-4567</p>
                        </div>
                    </div>
                    <div class="flex items-start space-x-4">
                        <div
                            class="w-12 h-12 bg-primary-100 text-primary-600 rounded-lg flex items-center justify-center flex-shrink-0">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                </path>
                            </svg>
                        </div>
                        <div>
                            <h4 class="font-semibold text-gray-900 mb-1">Email</h4>
                            <p class="text-gray-600">info@alnwoks.com</p>
                        </div>
                    </div>
                    <div class="flex items-start space-x-4">
                        <div
                            class="w-12 h-12 bg-primary-100 text-primary-600 rounded-lg flex items-center justify-center flex-shrink-0">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z">
                                </path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                        </div>
                        <div>
                            <h4 class="font-semibold text-gray-900 mb-1">Office</h4>
                            <p class="text-gray-600">123 Technology Drive<br>San Francisco, CA 94103</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-lg border border-gray-100 p-8" data-aos="fade-left"
                data-aos-delay="200">
                <h3 class="text-2xl font-bold text-gray-900 mb-6">Send us a Message</h3>
                <form @submit.prevent="submitContactForm()" class="space-y-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                        <input type="text" id="name" x-model="contactForm.name"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                            placeholder="Your name">
                        <template x-if="errors.name">
                            <p class="mt-1 text-sm text-red-600" x-text="errors.name"></p>
                        </template>
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="email" x-model="contactForm.email"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                            placeholder="your.email@example.com">
                        <template x-if="errors.email">
                            <p class="mt-1 text-sm text-red-600" x-text="errors.email"></p>
                        </template>
                    </div>
                    <div>
                        <label for="company" class="block text-sm font-medium text-gray-700 mb-1">Company</label>
                        <input type="text" id="company" x-model="contactForm.company"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                            placeholder="Your company name">
                    </div>
                    <div>
                        <label for="interest" class="block text-sm font-medium text-gray-700 mb-1">Interest</label>
                        <select id="interest" x-model="contactForm.interest"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors">
                            <option value="">Select your interest</option>
                            <option value="government">Government Solutions</option>
                            <option value="commercial">Commercial Solutions</option>
                            <option value="eazybdc">eazyBDC Product</option>
                            <option value="flowai">Flow AI Product</option>
                            <option value="ottomate">Ottomate Product</option>
                            <option value="datatloop">Datatloop Product</option>
                            <option value="partnership">Partnership Opportunity</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                        <textarea id="message" x-model="contactForm.message" rows="4"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                            placeholder="How can we help you?"></textarea>
                        <template x-if="errors.message">
                            <p class="mt-1 text-sm text-red-600" x-text="errors.message"></p>
                        </template>
                    </div>
                    <div>
                        <template x-if="isSubmitting">
                            <button type="button"
                                class="w-full bg-primary-600 text-white px-6 py-3 rounded-lg opacity-75 cursor-not-allowed"
                                disabled>
                                <span class="flex items-center justify-center">
                                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white"
                                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                            stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor"
                                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                        </path>
                                    </svg>
                                    Sending...
                                </span>
                            </button>
                        </template>
                        <template x-if="!isSubmitting && !isSubmitted">
                            <button type="submit"
                                class="w-full bg-primary-600 text-white px-6 py-3 rounded-lg hover:bg-primary-700 transition-colors duration-200">
                                Send Message
                            </button>
                        </template>
                        <template x-if="isSubmitted">
                            <div
                                class="w-full bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg">
                                <p>Thank you for your message! We'll get back to you soon.</p>
                            </div>
                        </template>
                        <template x-if="errors.general">
                            <p class="mt-2 text-sm text-red-600" x-text="errors.general"></p>
                        </template>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
